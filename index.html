<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الأسماء | بلمسة رندة زربا</title>
    
    <!-- إعدادات PWA والتطبيق -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e1065">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.25s ease;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top, #2e1065 0%, #0d1117 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* حاوية النجوم التفاعلية بالخلفية */
        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* رفع العناصر فوق الخلفية التفاعلية */
        .install-pwa-banner, .header-tag, h1, .tabs, .section-box, .loader, .card {
            position: relative;
            z-index: 10;
        }

        /* شريط تثبيت التطبيق */
        .install-pwa-banner {
            display: none;
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            width: 100%;
            max-width: 500px;
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(217, 70, 239, 0.4);
        }
        .install-pwa-btn {
            background: white;
            color: #a855f7;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
        }

        .header-tag {
            background: rgba(217, 70, 239, 0.15);
            color: #f0abfc;
            border: 1px solid rgba(217, 70, 239, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            backdrop-filter: blur(5px);
        }
        h1 { 
            color: #ffffff; 
            margin: 0 0 20px 0; 
            font-size: 2.1rem;
            text-align: center;
            font-weight: 900;
        }
        h1 span {
            background: linear-gradient(135deg, #f472b6, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(22, 27, 34, 0.8);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            box-shadow: 0 4px 12px rgba(217, 70, 239, 0.3);
        }

        .section-box {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            background: rgba(22, 27, 34, 0.8);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .compat-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }
        .input-style {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(22, 27, 34, 0.8);
            color: white;
            font-size: 1.05rem;
            outline: none;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }
        input::placeholder { color: #8b949e; }
        
        button.btn-main {
            width: 100%;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 70, 239, 0.3);
        }
        button.btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(217, 70, 239, 0.5);
        }

        .loader {
            display: none;
            color: #f472b6;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .card {
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 28px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
        }
        .title { color: #f472b6; font-size: 2.2rem; font-weight: 900; margin-bottom: 4px; }
        .badge { color: #a78bfa; font-size: 0.9rem; margin-bottom: 18px; font-weight: bold; }
        .desc { color: #e2e8f0; line-height: 1.8; font-size: 1.05rem; margin-bottom: 20px; }
        
        .randa-box {
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.12), rgba(139, 92, 246, 0.12));
            border-right: 4px solid #d946ef;
            padding: 16px 18px;
            border-radius: 12px;
            margin-top: 15px;
            border-top: 1px solid rgba(217, 70, 239, 0.2);
        }
        .randa-title { 
            color: #f472b6; 
            font-weight: 900; 
            font-size: 1.05rem;
            margin-bottom: 8px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .randa-desc { color: #ffffff; line-height: 1.7; font-size: 1rem; font-weight: 500; }

        .score-circle {
            font-size: 3rem;
            font-weight: 900;
            color: #f472b6;
            text-align: center;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .randa-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
        }

        .edit-area {
            display: none;
            margin-top: 12px;
        }
        .edit-area textarea {
            width: 100%;
            height: 90px;
            background: #0d1117;
            border: 1px solid #d946ef;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 10px;
            outline: none;
        }
        .btn-save {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #d946ef;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .watermark {
            display: none;
            text-align: center;
            color: #a78bfa;
            font-size: 0.8rem;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

    <!-- مكتبة النجوم والتفاعلات الساحرة -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- الخلفية التفاعلية -->
    <div id="tsparticles"></div>

    <div class="install-pwa-banner" id="pwaBanner">
        <span><i class="fa-solid fa-mobile-screen-button"></i> تنزيل التطبيق على الجوال</span>
        <button class="install-pwa-btn" onclick="installApp()">تثبيت الأن</button>
    </div>

    <div class="header-tag"><i class="fa-solid fa-crown"></i> الإصدار الخاص المعتمد</div>
    <h1>موسوعة الأسماء <span>بلمسة رندة زربا</span> ✨</h1>

    <div class="tabs">
        <button class="tab-btn active" id="tab1" onclick="switchTab('single')"><i class="fa-solid fa-magnifying-glass"></i> كشف اسم</button>
        <button class="tab-btn" id="tab2" onclick="switchTab('compat')"><i class="fa-solid fa-heart"></i> كاشف التوافق</button>
    </div>

    <div class="section-box" id="singleSection">
        <div class="search-box">
            <input type="text" id="nameInput" class="input-style" placeholder="اكتب الاسم هنا (مثال: هاشم، وعد، رندة)..." style="border:none; background:transparent;">
            <button class="btn-main" style="width:auto;" onclick="searchName()"><i class="fa-solid fa-wand-magic-sparkles"></i> كشف</button>
        </div>
    </div>

    <div class="section-box" id="compatSection" style="display: none;">
        <div class="compat-inputs">
            <input type="text" id="firstName" class="input-style" placeholder="الاسم الأول (مثال: رندة)...">
            <input type="text" id="secondName" class="input-style" placeholder="الاسم الثاني (مثال: محمد)...">
            <button class="btn-main" onclick="checkCompatibility()"><i class="fa-solid fa-calculator"></i> احسب نسبة التوافق ✨</button>
        </div>
    </div>

    <div class="loader" id="loader"><i class="fa-solid fa-spinner fa-spin"></i> جاري استحضار التحليل واللمسة المخصصة...</div>

    <div class="card" id="card">
        <div class="title" id="nameTitle">-</div>
        <div class="badge" id="nameOrigin">-</div>
        
        <div id="compatScoreBox" style="display: none;">
            <div class="score-circle" id="scoreVal">0%</div>
        </div>

        <div class="desc" id="nameMeaning">-</div>

        <div class="randa-box">
            <div class="randa-title"><i class="fa-solid fa-gem"></i> رأي وتحليل رندة زربا:</div>
            <div class="randa-desc" id="funnyText">-</div>
        </div>

        <div class="watermark" id="cardWatermark">✨ تم التوليد عبر موسوعة الأسماء بلمسة رندة زربا ✨</div>

        <div class="action-btns" id="actionBtns">
            <button class="btn-download" onclick="downloadCard()"><i class="fa-solid fa-download"></i> تحميل بطاقة الإهداء</button>
            <button class="randa-btn" onclick="openRandaEditor()"><i class="fa-solid fa-user-gear"></i> لوحة التحكم</button>
        </div>
        
        <div class="edit-area" id="editArea">
            <textarea id="randaInput" placeholder="اكتبي التحليل الفكاهي أو بصمتك المخصصة..."></textarea>
            <button class="btn-save" onclick="saveRandaComment()"><i class="fa-solid fa-cloud-arrow-up"></i> اعتماد ونشر أونلاين</button>
        </div>
    </div>

    <script>
        /* تشغيل محرك الجزيئات الساحرة بالخلفية */
        tsParticles.load("tsparticles", {
            fpsLimit: 60,
            particles: {
                number: { value: 40, density: { enable: true, area: 800 } },
                color: { value: ["#d946ef", "#c084fc", "#f472b6"] },
                shape: { type: "circle" },
                opacity: { value: { min: 0.2, max: 0.7 } },
                size: { value: { min: 1, max: 3 } },
                move: {
                    enable: true,
                    speed: 1,
                    direction: "none",
                    outModes: { default: "out" }
                },
                links: {
                    enable: true,
                    distance: 120,
                    color: "#c084fc",
                    opacity: 0.25,
                    width: 1
                }
            },
            interactivity: {
                events: {
                    onHover: { enable: true, mode: "grab" },
                    onClick: { enable: true, mode: "push" }
                },
                modes: {
                    grab: { distance: 140, links: { opacity: 0.5 } },
                    push: { quantity: 3 }
                }
            },
            detectRetina: true
        });

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaBanner').style.display = 'flex';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('pwaBanner').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAD9NWqGXT1Iewyc8947i6_OJ_MXnPp0EH4",
            authDomain: "randa-names.firebaseapp.com",
            projectId: "randa-names",
            storageBucket: "randa-names.firebasestorage.app",
            messagingSenderId: "282324926770",
            appId: "1:282324926770:web:666ef9be9b07692610972b",
            databaseURL: "https://randa-names-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let db = {};
        let currentSearchName = "";
        let currentMode = "single";

        const defaultMeanings = {
            "هاشم": "اسم علم عربي مذكر، يعني الكاسر أو الهشام الذي يكسر الخبز ليطعم غيره، وهو يدل على الكرم الشديد والجود والشهامة.",
            "وعد": "اسم علم عربي مؤنث، يعني الالتزام والعهد والوفاء بالذمة والصراحة في التعامل والعهد بالخير.",
            "رندة": "اسم علم عربي مؤنث، منسوب إلى شجر الرند وهو الشجر طيب الرائحة الكريمة ذات العبق العطر.",
            "محمد": "اسم علم عربي مذكر، صيغة مبالغة من الحمد، ويعني المحمود والمشكور كثير الصفات الحميدة.",
            "احمد": "اسم علم عربي مذكر، من صفات الحمد والمحمودية والثناء والرفعة."
        };

        fetch('names_db.json')
            .then(res => res.json())
            .then(data => { db = data; })
            .catch(err => console.error(err));

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('card').style.display = 'none';
            if (mode === 'single') {
                document.getElementById('tab1').classList.add('active');
                document.getElementById('tab2').classList.remove('active');
                document.getElementById('singleSection').style.display = 'flex';
                document.getElementById('compatSection').style.display = 'none';
            } else {
                document.getElementById('tab2').classList.add('active');
                document.getElementById('tab1').classList.remove('active');
                document.getElementById('compatSection').style.display = 'flex';
                document.getElementById('singleSection').style.display = 'none';
            }
        }

        function normalizeText(str) {
            return str.replace(/[أإآ]/g, 'ا').replace(/ة$/g, 'ه').replace(/[\u064B-\u0652]/g, '').trim();
        }

        function getAbjadValue(str) {
            const abjad = {
                'ا':1, 'ب':2, 'ج':3, 'د':4, 'ه':5, 'و':6, 'ز':7, 'ح':8, 'ط':9,
                'ي':10, 'ك':20, 'ل':30, 'م':40, 'ن':50, 'س':60, 'ع':70, 'ف':80,
                'ص':90, 'ق':100, 'ر':200, 'ش':300, 'ت':400, 'ث':500, 'خ':600,
                'ذ':700, 'ض':800, 'ظ':900, 'غ':1000, 'ى':10, 'ئ':10, 'ء':1
            };
            let sum = 0;
            const clean = normalizeText(str);
            for (let char of clean) {
                if (abjad[char]) sum += abjad[char];
            }
            return sum;
        }

        function checkCompatibility() {
            const name1 = document.getElementById('firstName').value.trim();
            const name2 = document.getElementById('secondName').value.trim();

            if (!name1 || !name2) {
                alert("الرجاء كتابة الاسمين أولاً!");
                return;
            }

            const card = document.getElementById('card');
            const loader = document.getElementById('loader');
            card.style.display = 'none';
            loader.style.display = 'block';

            const val1 = getAbjadValue(name1);
            const val2 = getAbjadValue(name2);
            let score = ((val1 + val2) % 30) + 70;

            setTimeout(() => {
                document.getElementById('nameTitle').innerText = `${name1} ❤️ ${name2}`;
                document.getElementById('nameOrigin').innerText = "تحليل انسجام وتوافق الأسماء";
                document.getElementById('compatScoreBox').style.display = 'block';
                document.getElementById('scoreVal').innerText = `${score}%`;
                document.getElementById('nameMeaning').innerText = `بناءً على حسابات التوافق الأبجدي واللغوي، يظهر انسجام وتناغم عالي بين اسم (${name1}) واسم (${name2}) في الصفات والطباع.`;

                let randaComment = "";
                if (score >= 90) {
                    randaComment = `التوافق عالي جداً! تفاهم عالي وطاقة إيجابية ممتازة، التناغم بينكم كأنه مكتوب ومحسوب بالمليمتر!`;
                } else if (score >= 80) {
                    randaComment = `نسبة انسجام ممتازة! في كيمياء حلوة وتفاهم راقي، والمهم إنه كل واحد بكمل الثاني بطريقته!`;
                } else {
                    randaComment = `نسبة توافق متوازنة ولطيفة! تحتاج شوية هدوء وتنسيق والتفاصيل الصغيرة بتكون عسل بينكم!`;
                }

                document.getElementById('funnyText').innerText = randaComment;
                loader.style.display = 'none';
                card.style.display = 'block';
            }, 500);
        }

        async function searchName() {
            const rawInput = document.getElementById('nameInput').value.trim();
            const card = document.getElementById('card');
            const loader = document.getElementById('loader');

            if (!rawInput) return;
            currentSearchName = rawInput;

            card.style.display = 'none';
            document.getElementById('editArea').style.display = 'none';
            document.getElementById('compatScoreBox').style.display = 'none';
            loader.style.display = 'block';

            const cleanedInput = normalizeText(rawInput);
            let foundKey = Object.keys(db).find(key => normalizeText(key) === cleanedInput);

            if (foundKey) {
                document.getElementById('nameTitle').innerText = rawInput;
                document.getElementById('nameOrigin').innerText = db[foundKey].origin;
                document.getElementById('nameMeaning').innerText = db[foundKey].meaning;
            } else if (defaultMeanings[cleanedInput] || defaultMeanings[rawInput]) {
                document.getElementById('nameTitle').innerText = rawInput;
                document.getElementById('nameOrigin').innerText = "أصل عربي / معتمد";
                document.getElementById('nameMeaning').innerText = defaultMeanings[cleanedInput] || defaultMeanings[rawInput];
            } else {
                document.getElementById('nameTitle').innerText = rawInput;
                document.getElementById('nameOrigin').innerText = "أصل عربي / معتمد";
                document.getElementById('nameMeaning').innerText = `اسم علم عربي أصيل يحمل معاني النبل والصفات الحميدة والتميز في مجتمعه.`;
            }

            const cleanKeyForFirebase = cleanedInput.replace(/[.#$\[\]]/g, '');
            database.ref('randa_comments/' + cleanKeyForFirebase).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    document.getElementById('funnyText').innerText = snapshot.val();
                } else {
                    const isFemale = rawInput.endsWith('ة') || rawInput.endsWith('ه') || rawInput.endsWith('اء') || rawInput === 'وعد' || rawInput === 'رندة';
                    if (isFemale) {
                        document.getElementById('funnyText').innerText = `${rawInput} شخصية راقية وحساسة، بتعرف شو بدها بالضبط والتفاصيل عندها مية بالمية!`;
                    } else {
                        document.getElementById('funnyText').innerText = `${rawInput} شخصية قيادية، بحب الهدوء وبيفكر صح قبل أي قرار!`;
                    }
                }
                loader.style.display = 'none';
                card.style.display = 'block';
            });
        }

        function downloadCard() {
            const card = document.getElementById('card');
            const actionBtns = document.getElementById('actionBtns');
            const watermark = document.getElementById('cardWatermark');

            actionBtns.style.display = 'none';
            watermark.style.display = 'block';

            html2canvas(card, {
                backgroundColor: '#161b22',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `بطاقة_${document.getElementById('nameTitle').innerText}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();

                actionBtns.style.display = 'flex';
                watermark.style.display = 'none';
            });
        }

        function openRandaEditor() {
            const pin = prompt("أدخلي الرمز السري الخاص بـ رندة زربا:");
            if (pin === "2012") {
                document.getElementById('editArea').style.display = 'block';
                document.getElementById('randaInput').value = document.getElementById('funnyText').innerText;
            } else if (pin !== null) {
                alert("الرمز السري غير صحيح!");
            }
        }

        function saveRandaComment() {
            const comment = document.getElementById('randaInput').value.trim();
            if (!comment) return;

            const cleanKeyForFirebase = normalizeText(currentSearchName).replace(/[.#$\[\]]/g, '');
            database.ref('randa_comments/' + cleanKeyForFirebase).set(comment).then(() => {
                alert("تم اعتماد لمسة رندة زربا بنجاح وستظهر للجميع الآن!");
                document.getElementById('funnyText').innerText = comment;
                document.getElementById('editArea').style.display = 'none';
            }).catch(err => {
                alert("خطأ بالحفظ!");
            });
        }
    </script>
</body>
</html>
