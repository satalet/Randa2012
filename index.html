<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الأسماء وطاقة الساجو الكورية | بلمسة رندة زربا</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e1065">
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas لمشاركة البطاقة كصورة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            transition: all 0.25s ease;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية النجوم التفاعلية Canvas */
        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at top, #2e1065 0%, #0d1117 100%);
        }

        /* شريط تثبيت التطبيق PWA */
        .pwa-banner {
            display: none;
            background: linear-gradient(90deg, #d946ef, #8b5cf6);
            color: white;
            width: 100%;
            max-width: 500px;
            padding: 10px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(217, 70, 239, 0.4);
            font-weight: bold;
            font-size: 0.95rem;
        }
        .pwa-btn {
            background: white;
            color: #2e1065;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
        }

        .header-tag {
            background: rgba(217, 70, 239, 0.15);
            color: #f0abfc;
            border: 1px solid rgba(217, 70, 239, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        h1 { 
            color: #ffffff; 
            margin: 0 0 20px 0; 
            font-size: 1.8rem;
            text-align: center;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        h1 span {
            background: linear-gradient(135deg, #f472b6, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* أزرار التبويبات المتعددة */
        .tab-switch {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: rgba(22, 27, 34, 0.9);
            border-radius: 16px;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        .tab-btn {
            flex: 1 1 45%;
            padding: 10px 6px;
            border: none;
            background: transparent;
            color: #8b949e;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            box-shadow: 0 4px 12px rgba(217, 70, 239, 0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            background: rgba(22, 27, 34, 0.9);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(217, 70, 239, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            flex-direction: column;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 0.85rem;
            color: #f0abfc;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(13, 17, 23, 0.8);
            color: white;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }
        input:focus { border-color: #d946ef; }
        input::placeholder { color: #8b949e; }

        /* تنسيق قوائم التواريخ المنسدلة للسهولة على الجوال */
        .date-select-container {
            display: flex;
            gap: 6px;
        }
        .date-select-container select {
            flex: 1;
            padding: 10px 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(13, 17, 23, 0.9);
            color: white;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }
        .date-select-container select:focus { border-color: #d946ef; }
        
        button.btn-search {
            width: 100%;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 70, 239, 0.3);
            margin-top: 6px;
        }
        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(217, 70, 239, 0.5);
        }

        .loader {
            display: none;
            color: #f472b6;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        /* البطاقة الرئيسية */
        .card {
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .title { color: #f472b6; font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; }
        .badge { color: #a78bfa; font-size: 0.9rem; margin-bottom: 16px; font-weight: bold; }
        .desc { color: #e2e8f0; line-height: 1.8; font-size: 0.98rem; margin-bottom: 18px; }
        
        .randa-box {
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.12), rgba(139, 92, 246, 0.12));
            border-right: 4px solid #d946ef;
            padding: 14px 16px;
            border-radius: 12px;
            margin-top: 15px;
            border-top: 1px solid rgba(217, 70, 239, 0.2);
        }
        .randa-title { 
            color: #f472b6; 
            font-weight: 900; 
            font-size: 1rem;
            margin-bottom: 8px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .randa-desc { color: #ffffff; line-height: 1.7; font-size: 0.98rem; font-weight: 500; }

        /* أزرار المشاركة والتحكم */
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }
        .action-btn:hover {
            background: rgba(217, 70, 239, 0.2);
            color: #fff;
            border-color: #d946ef;
        }
        .action-btn.share-btn {
            background: linear-gradient(135deg, rgba(217,70,239,0.2), rgba(139,92,246,0.2));
            border-color: rgba(217,70,239,0.4);
            color: #f0abfc;
        }

        .edit-area {
            display: none;
            margin-top: 12px;
            animation: fadeIn 0.3s ease-out;
        }
        .edit-area textarea {
            width: 100%;
            height: 85px;
            background: #0d1117;
            border: 1px solid #d946ef;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 10px;
            outline: none;
        }
        .btn-save {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #d946ef;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- خلفية النجوم المتحركة -->
    <canvas id="starsCanvas"></canvas>

    <!-- شريط تنزيل PWA -->
    <div class="pwa-banner" id="pwaBanner">
        <span><i class="fa-solid fa-mobile-screen-button"></i> تنزيل التطبيق على الجوال</span>
        <button class="pwa-btn" id="installPwaBtn">تثبيت الآن</button>
    </div>

    <div class="header-tag"><i class="fa-solid fa-crown"></i> الإصدار الخاص المعتمد</div>
    <h1>موسوعة الأسماء <span>وطاقة الساجو الكورية</span> ✨</h1>

    <!-- تبويبات النظام -->
    <div class="tab-switch">
        <button class="tab-btn active" id="tabSingle" onclick="switchTab('single')"><i class="fa-solid fa-magnifying-glass"></i> كشف اسم</button>
        <button class="tab-btn" id="tabDouble" onclick="switchTab('double')"><i class="fa-solid fa-heart"></i> كاشف التوافق</button>
        <button class="tab-btn" id="tabSaju" onclick="switchTab('saju')"><i class="fa-solid fa-yin-yang"></i> طاقة الساجو الكورية</button>
        <button class="tab-btn" id="tabGunghap" onclick="switchTab('gunghap')"><i class="fa-solid fa-hand-holding-heart"></i> التوافق الكوري Gunghap</button>
    </div>

    <!-- 1. صندوق كشف اسم فردي -->
    <div class="search-box" id="singleBox">
        <div class="input-group">
            <label>الاسم المراد البحث عنه:</label>
            <input type="text" id="nameInput" placeholder="اكتب الاسم هنا (مثال: هاشم، وعد، نوال)..." onkeyup="if(event.key === 'Enter') searchName()">
        </div>
        <button class="btn-search" onclick="searchName()"><i class="fa-solid fa-wand-magic-sparkles"></i> كشف المعنى</button>
    </div>

    <!-- 2. صندوق كاشف التوافق العادي -->
    <div class="search-box" id="doubleBox" style="display: none;">
        <div class="input-group">
            <label>الاسم الأول:</label>
            <input type="text" id="firstNameInput" placeholder="مثال: محمد">
        </div>
        <div class="input-group">
            <label>الاسم الثاني:</label>
            <input type="text" id="secondNameInput" placeholder="مثال: رندة" onkeyup="if(event.key === 'Enter') checkCompatibility()">
        </div>
        <button class="btn-search" onclick="checkCompatibility()"><i class="fa-solid fa-heart-circle-check"></i> فحص التوافق</button>
    </div>

    <!-- 3. صندوق طاقة الساجو الكورية (اسم + القوائم المنسدلة للتواريخ) -->
    <div class="search-box" id="sajuBox" style="display: none;">
        <div class="input-group">
            <label>الاسم الشخصي:</label>
            <input type="text" id="sajuNameInput" placeholder="أدخل اسمك الكريم...">
        </div>
        <div class="input-group">
            <label>تاريخ الميلاد الكامل:</label>
            <div class="date-select-container">
                <select id="sajuDay"></select>
                <select id="sajuMonth"></select>
                <select id="sajuYear"></select>
            </div>
        </div>
        <button class="btn-search" onclick="calculateSaju()"><i class="fa-solid fa-fire-flame-curved"></i> استخراج طاقة العناصر الخمسة</button>
    </div>

    <!-- 4. صندوق التوافق الكوري Gunghap (اسمين + القوائم المنسدلة للتواريخ) -->
    <div class="search-box" id="gunghapBox" style="display: none;">
        <div class="input-group">
            <label>اسم وتاريخ ميلاد الطرف الأول:</label>
            <input type="text" id="gName1" placeholder="اسم الطرف الأول...">
            <div class="date-select-container">
                <select id="gDay1"></select>
                <select id="gMonth1"></select>
                <select id="gYear1"></select>
            </div>
        </div>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1); width: 100%;">
        <div class="input-group">
            <label>اسم وتاريخ ميلاد الطرف الثاني:</label>
            <input type="text" id="gName2" placeholder="اسم الطرف الثاني...">
            <div class="date-select-container">
                <select id="gDay2"></select>
                <select id="gMonth2"></select>
                <select id="gYear2"></select>
            </div>
        </div>
        <button class="btn-search" onclick="calculateGunghap()"><i class="fa-solid fa-dna"></i> تحليل التوافق الكوري الشامل</button>
    </div>

    <div class="loader" id="loader"><i class="fa-solid fa-spinner fa-spin"></i> جاري استحضار التحليل واللمسة المخصصة...</div>

    <!-- بطاقة العرض -->
    <div class="card" id="card">
        <div class="title" id="nameTitle">-</div>
        <div class="badge" id="nameOrigin">-</div>
        <div class="desc" id="nameMeaning">-</div>

        <div class="randa-box">
            <div class="randa-title"><i class="fa-solid fa-gem"></i> رأي وتحليل رندة زربا:</div>
            <div class="randa-desc" id="funnyText">-</div>
        </div>

        <div class="card-actions">
            <button class="action-btn share-btn" onclick="shareCardAsImage()"><i class="fa-solid fa-share-nodes"></i> مشاركة البطاقة</button>
            <button class="action-btn" onclick="openRandaEditor()"><i class="fa-solid fa-user-gear"></i> لوحة رندة</button>
        </div>
        
        <div class="edit-area" id="editArea">
            <textarea id="randaInput" placeholder="اكتبي التحليل الفكاهي أو بصمتك المخصصة لهذا الاسم..."></textarea>
            <button class="btn-save" onclick="saveRandaComment()"><i class="fa-solid fa-cloud-arrow-up"></i> اعتماد ونشر أونلاين</button>
        </div>
    </div>

    <script>
        // --- تهيئة Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyAD9NWqGXT1Iewyc8947i6_OJ_MXnPp0EH4",
            authDomain: "randa-names.firebaseapp.com",
            projectId: "randa-names",
            storageBucket: "randa-names.firebasestorage.app",
            messagingSenderId: "282324926770",
            appId: "1:282324926770:web:666ef9be9b07692610972b",
            databaseURL: "https://randa-names-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let db = {};
        let currentSearchName = "";
        let currentMode = "single";

        const defaultMeanings = {
            "هاشم": "اسم علم عربي مذكر، يعني الكاسر أو الهشام الذي يكسر الخبز ليطعم غيره، وهو يدل على الكرم الشديد والجود والشهامة.",
            "وعد": "اسم علم عربي مؤنث، يعني الالتزام والعهد والوفاء بالذمة والصراحة في التعامل والعهد بالخير.",
            "رنده": "اسم علم عربي مؤنث، منسوب إلى شجر الرند وهو الشجر طيب الرائحة الكريمة ذات العبق العطر.",
            "رندة": "اسم علم عربي مؤنث، منسوب إلى شجر الرند وهو الشجر طيب الرائحة الكريمة ذات العبق العطر.",
            "محمد": "اسم علم عربي مذكر، صيغة مبالغة من الحمد، ويعني المحمود والمشكور كثير الصفات الحميدة.",
            "احمد": "اسم علم عربي مذكر، من صفات الحمد والمحمودية والثناء والرفعة."
        };

        fetch('names_db.json')
            .then(res => res.json())
            .then(data => { db = data; })
            .catch(err => console.error(err));

        function normalizeText(str) {
            return str.replace(/[أإآ]/g, 'ا').replace(/ة$/g, 'ه').replace(/[\u064B-\u0652]/g, '').trim();
        }

        function decodeHTML(html) {
            let txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        // --- تعبئة القوائم المنسدلة للتواريخ تلقائياً لتسهيل الاستخدام على الجوال ---
        function initDateDropdowns() {
            const currentYear = new Date().getFullYear();
            const days = Array.from({length: 31}, (_, i) => i + 1);
            const months = Array.from({length: 12}, (_, i) => i + 1);
            const years = Array.from({length: 90}, (_, i) => currentYear - i); // قائمة السنين لقبل 90 سنة

            const fill = (dId, mId, yId) => {
                const d = document.getElementById(dId);
                const m = document.getElementById(mId);
                const y = document.getElementById(yId);
                if (!d) return;

                d.innerHTML = '<option value="">اليوم</option>' + days.map(i => `<option value="${i}">${i}</option>`).join('');
                m.innerHTML = '<option value="">الشهر</option>' + months.map(i => `<option value="${i}">${i}</option>`).join('');
                y.innerHTML = '<option value="">السنة</option>' + years.map(i => `<option value="${i}">${i}</option>`).join('');
            };

            fill('sajuDay', 'sajuMonth', 'sajuYear');
            fill('gDay1', 'gMonth1', 'gYear1');
            fill('gDay2', 'gMonth2', 'gYear2');
        }
        window.addEventListener('DOMContentLoaded', initDateDropdowns);

        // --- التبديل بين التبويبات الأربعة ---
        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('card').style.display = 'none';
            
            const tabs = ['tabSingle', 'tabDouble', 'tabSaju', 'tabGunghap'];
            const boxes = ['singleBox', 'doubleBox', 'sajuBox', 'gunghapBox'];

            tabs.forEach(t => document.getElementById(t).classList.remove('active'));
            boxes.forEach(b => document.getElementById(b).style.display = 'none');

            if (mode === 'single') {
                document.getElementById('tabSingle').classList.add('active');
                document.getElementById('singleBox').style.display = 'flex';
            } else if (mode === 'double') {
                document.getElementById('tabDouble').classList.add('active');
                document.getElementById('doubleBox').style.display = 'flex';
            } else if (mode === 'saju') {
                document.getElementById('tabSaju').classList.add('active');
                document.getElementById('sajuBox').style.display = 'flex';
            } else if (mode === 'gunghap') {
                document.getElementById('tabGunghap').classList.add('active');
                document.getElementById('gunghapBox').style.display = 'flex';
            }
        }

        // --- 1. البحث المباشر وتصفية الشخصيات ---
        async function searchName() {
            const rawInput = document.getElementById('nameInput').value.trim();
            const card = document.getElementById('card');
            const loader = document.getElementById('loader');

            if (!rawInput) return;
            currentSearchName = rawInput;

            card.style.display = 'none';
            document.getElementById('editArea').style.display = 'none';
            loader.style.display = 'block';

            const cleanedInput = normalizeText(rawInput);
            let foundKey = Object.keys(db).find(key => normalizeText(key) === cleanedInput);

            if (foundKey) {
                document.getElementById('nameTitle').innerText = rawInput;
                document.getElementById('nameOrigin').innerText = db[foundKey].origin;
                document.getElementById('nameMeaning').innerText = db[foundKey].meaning;
            } else if (defaultMeanings[cleanedInput] || defaultMeanings[rawInput]) {
                document.getElementById('nameTitle').innerText = rawInput;
                document.getElementById('nameOrigin').innerText = "أصل عربي / معتمد";
                document.getElementById('nameMeaning').innerText = defaultMeanings[cleanedInput] || defaultMeanings[rawInput];
            } else {
                try {
                    const searchQuery = `"${rawInput} (اسم)" OR ("${rawInput}" "اسم علم") OR ("${rawInput}" "اسم شخصي")`;
                    const searchUrl = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(searchQuery)}&format=json&origin=*`;
                    
                    const response = await fetch(searchUrl);
                    const data = await response.json();

                    let foundValidMeaning = false;
                    const bioExcludeKeywords = ['سياسي', 'لاعب', 'ممثل', 'مغني', 'مطرب', 'قائد', 'فنان', 'رئيس', 'ملك', 'أمير', 'ولد', 'توفي', 'سيرة', 'ضابط', 'كاتب', 'شاعر', 'وزير', 'سفير', 'جنرال', 'حاكم', 'ناشط', 'مخرج', 'بطولة', 'منتخب', 'فريق', 'مسلسل', 'فيلم'];

                    if (data.query && data.query.search.length > 0) {
                        const bestMatch = data.query.search.find(item => {
                            const fullContent = (item.title + " " + item.snippet).toLowerCase();
                            const isBio = bioExcludeKeywords.some(word => fullContent.includes(word));
                            const isNameArticle = item.title.includes("(اسم)") || item.snippet.includes("اسم علم") || item.snippet.includes("اسم شخصي");
                            return isNameArticle && !isBio;
                        });

                        if (bestMatch) {
                            let snippet = bestMatch.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                            document.getElementById('nameTitle').innerText = rawInput;
                            document.getElementById('nameOrigin').innerText = "المصدر: موسوعة ويكيبيديا (معاني الأسماء)";
                            document.getElementById('nameMeaning').innerText = decodeHTML(snippet) + "...";
                            foundValidMeaning = true;
                        }
                    }

                    if (!foundValidMeaning) {
                        document.getElementById('nameTitle').innerText = rawInput;
                        document.getElementById('nameOrigin').innerText = "أصل عربي / معتمد";
                        document.getElementById('nameMeaning').innerText = "اسم علم جميل يحمل معاني الأصالة والرفعة والصفات الطيبة.";
                    }
                } catch (e) {
                    document.getElementById('nameTitle').innerText = rawInput;
                    document.getElementById('nameOrigin').innerText = "أصل عربي / معتمد";
                    document.getElementById('nameMeaning').innerText = "اسم علم جميل يدل على الأصالة والسمو والصفات الطيبة.";
                }
            }

            const cleanKeyForFirebase = cleanedInput.replace(/[.#$\[\]]/g, '');
            database.ref('randa_comments/' + cleanKeyForFirebase).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    document.getElementById('funnyText').innerText = snapshot.val();
                } else {
                    const isFemale = rawInput.endsWith('ة') || rawInput.endsWith('ه') || rawInput.endsWith('اء') || rawInput === 'وعد';
                    if (isFemale) {
                        document.getElementById('funnyText').innerText = `${rawInput} شخصية راقية وحساسة، بتعرف شو بدها بالضبط والتفاصيل عندها مية بالمية!`;
                    } else {
                        document.getElementById('funnyText').innerText = `${rawInput} شخصية قيادية، بحب الهدوء وبيفكر صح قبل أي قرار!`;
                    }
                }
                loader.style.display = 'none';
                card.style.display = 'block';
            });
        }

        // --- 2. كاشف التوافق البسيط ---
        function checkCompatibility() {
            const name1 = document.getElementById('firstNameInput').value.trim();
            const name2 = document.getElementById('secondNameInput').value.trim();
            if (!name1 || !name2) return;

            document.getElementById('card').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                const totalLength = name1.length + name2.length;
                const score = 80 + (totalLength * 3) % 21;

                document.getElementById('nameTitle').innerText = `${name1} ❤️ ${name2}`;
                document.getElementById('nameOrigin').innerText = `نسبة التوافق الروحي: ${score}%`;
                document.getElementById('nameMeaning').innerText = `توافق جميل جداً يجمعهما الاحترام والانسجام المتبادل، وتفاهم عالي في المواقف والقرارات!`;
                document.getElementById('funnyText').innerText = `تحليل رندة: ${name1} و ${name2} ثنائي متناغم جداً، العلاقة بدها شوية موازنة بالعصبية والأمور الباقية مية بالمية!`;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('card').style.display = 'block';
            }, 600);
        }

        // --- 3. حساب طاقة الساجو الكورية (العناصر الخمسة) ---
        function getSajuElement(year) {
            const lastDigit = year % 10;
            if (lastDigit === 0 || lastDigit === 1) return { name: "عنصر المعدن (Metal - 金)", color: "الذهبي والأبيض", traits: "شخصية قوية، منظمة، حاسمة، مخلصة جداً، ومباشرة في القرارات.", symbol: "⚔️" };
            if (lastDigit === 2 || lastDigit === 3) return { name: "عنصر الماء (Water - 水)", color: "الأزرق والكحلي والأسود", traits: "شخصية حكيمة، مرنة كالماء، هادئة، وعميقة التفكير مع حس عاطفي راقي.", symbol: "🌊" };
            if (lastDigit === 4 || lastDigit === 5) return { name: "عنصر الخشب (Wood - 木)", color: "الأخضر والزيتي", traits: "شخصية مبدعة، متجددة، تحب النمو والتطور المستمر، ومتفائلة دائماً.", symbol: "🌿" };
            if (lastDigit === 6 || lastDigit === 7) return { name: "عنصر النار (Fire - 火)", color: "الأحمر والوردي والأرجواني", traits: "شخصية شغوفة، مليئة بالحيوية والكاريزما، قيادية، ولديها حضور ملفت.", symbol: "🔥" };
            return { name: "عنصر التراب (Earth - 土)", color: "الأصفر والبني والبيج", traits: "شخصية مستقرة، صبورة، موثوقة جداً، عملية، وتحفظ الأسرار بعناية.", symbol: "⛰️" };
        }

        function calculateSaju() {
            const name = document.getElementById('sajuNameInput').value.trim();
            const year = document.getElementById('sajuYear').value;
            const month = document.getElementById('sajuMonth').value;
            const day = document.getElementById('sajuDay').value;

            if (!name || !year || !month || !day) {
                alert("الرجاء إدخال الاسم واختيار تاريخ الميلاد كاملاً!");
                return;
            }

            document.getElementById('card').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                const birthYear = parseInt(year);
                const elem = getSajuElement(birthYear);

                document.getElementById('nameTitle').innerText = `${elem.symbol} ${name} (${elem.name})`;
                document.getElementById('nameOrigin').innerText = `الرمز الكوري المعتمد وطاقة سنة ${birthYear}`;
                document.getElementById('nameMeaning').innerText = `طبيعة الطاقة: ${elem.traits}\n\n🎨 ألوان الحظ الخاصة بطاقتك: ${elem.color}.`;
                document.getElementById('funnyText').innerText = `تحليل رندة للساجو: ${name} طاقته الكورية قوية جداً! عنده هيبة وكاريزما، بس لما يعصب بصير بدو كاسة قهوة تركية ليروق! ☕✨`;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('card').style.display = 'block';
            }, 700);
        }

        // --- 4. فحص التوافق الكوري Gunghap ---
        function calculateGunghap() {
            const name1 = document.getElementById('gName1').value.trim();
            const y1 = parseInt(document.getElementById('gYear1').value);
            const name2 = document.getElementById('gName2').value.trim();
            const y2 = parseInt(document.getElementById('gYear2').value);

            if (!name1 || !y1 || !name2 || !y2) {
                alert("يرجى إدخال أسماء وتواريخ ميلاد الطرفين للتحليل الشامل!");
                return;
            }

            document.getElementById('card').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                const e1 = getSajuElement(y1);
                const e2 = getSajuElement(y2);

                const score = 82 + ((y1 + y2 + name1.length + name2.length) % 18);

                document.getElementById('nameTitle').innerText = `${name1} 💞 ${name2}`;
                document.getElementById('nameOrigin').innerText = `تحليل الجونغ هاب (Gunghap): نسبة الانسجام ${score}%`;
                document.getElementById('nameMeaning').innerText = `🔮 التناغم الكوري بين العناصر:\n- طاقة ${name1}: ${e1.name}\n- طاقة ${name2}: ${e2.name}\n\nالعلاقة بينهما قائمة على التبادل الإيجابي والدعم النفسي، ويشكلان ثنائياً متوازناً وقوياً جداً!`;
                document.getElementById('funnyText').innerText = `تحليل رندة للجونغ هاب: كيمياء رهيبة بين ${name1} و ${name2}! العصبية بتختفي بسرعة والضحك بيغلب على طبعهم سوا! 💫`;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('card').style.display = 'block';
            }, 800);
        }

        // --- لوحة التحكم والتعديل بكلمة السر ---
        function openRandaEditor() {
            const pin = prompt("أدخلي الرمز السري الخاص بـ رندة زربا:");
            if (pin === "1822012") {
                document.getElementById('editArea').style.display = 'block';
                document.getElementById('randaInput').value = document.getElementById('funnyText').innerText;
            } else if (pin !== null) {
                alert("الرمز السري غير صحيح!");
            }
        }

        function saveRandaComment() {
            const comment = document.getElementById('randaInput').value.trim();
            if (!comment) return;

            const cleanKeyForFirebase = normalizeText(currentSearchName || "general").replace(/[.#$\[\]]/g, '');
            database.ref('randa_comments/' + cleanKeyForFirebase).set(comment).then(() => {
                alert("تم اعتماد لمسة رندة زربا بنجاح وستظهر للجميع الآن!");
                document.getElementById('funnyText').innerText = comment;
                document.getElementById('editArea').style.display = 'none';
            }).catch(err => {
                alert("خطأ بالحفظ: تأكد من تفعيل Realtime Database");
            });
        }

        // --- مشاركة البطاقة كصورة ---
        function shareCardAsImage() {
            const cardElement = document.getElementById('card');
            html2canvas(cardElement, { backgroundColor: '#161b22' }).then(canvas => {
                canvas.toBlob(blob => {
                    const file = new File([blob], `${currentSearchName || 'تحليل_الاسم'}.png`, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: 'موسوعة الأسماء - رندة زربا',
                            text: 'شوف كشف وتحليل هذا الاسم بلمسة رندة زربا! ✨'
                        });
                    } else {
                        const link = document.createElement('a');
                        link.download = `${currentSearchName || 'card'}.png`;
                        link.href = canvas.toDataURL();
                        link.click();
                    }
                });
            });
        }

        // --- خلفية النجوم والتفاعلية ---
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(244, 114, 182, ${Math.abs(star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- دعم PWA التثبيت ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaBanner').style.display = 'flex';
        });

        document.getElementById('installPwaBtn').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    document.getElementById('pwaBanner').style.display = 'none';
                    deferredPrompt = null;
                });
            }
        });
    </script>
</body>
