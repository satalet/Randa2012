<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الأسماء | بلمسة رندة زربا</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.25s ease;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top, #2e1065 0%, #0d1117 100%);
        }
        .header-tag {
            background: rgba(217, 70, 239, 0.15);
            color: #f0abfc;
            border: 1px solid rgba(217, 70, 239, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        h1 { 
            color: #ffffff; 
            margin: 0 0 25px 0; 
            font-size: 2.2rem;
            text-align: center;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        h1 span {
            background: linear-gradient(135deg, #f472b6, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 500px;
            background: rgba(22, 27, 34, 0.8);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: white;
            font-size: 1.05rem;
            outline: none;
            font-family: inherit;
        }
        input::placeholder { color: #8b949e; }
        button.btn-search {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 70, 239, 0.3);
        }
        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(217, 70, 239, 0.5);
        }
        .loader {
            display: none;
            color: #f472b6;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 28px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .title { color: #f472b6; font-size: 2.2rem; font-weight: 900; margin-bottom: 4px; }
        .badge { color: #a78bfa; font-size: 0.9rem; margin-bottom: 18px; font-weight: bold; }
        .desc { color: #e2e8f0; line-height: 1.8; font-size: 1.05rem; margin-bottom: 20px; }
        
        .randa-box {
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.12), rgba(139, 92, 246, 0.12));
            border-right: 4px solid #d946ef;
            padding: 16px 18px;
            border-radius: 12px;
            margin-top: 15px;
            border-top: 1px solid rgba(217, 70, 239, 0.2);
        }
        .randa-title { 
            color: #f472b6; 
            font-weight: 900; 
            font-size: 1.05rem;
            margin-bottom: 8px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .randa-desc { color: #ffffff; line-height: 1.7; font-size: 1rem; font-weight: 500; }

        .randa-btn {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.88rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .randa-btn:hover {
            background: rgba(217, 70, 239, 0.2);
            color: #fff;
            border-color: #d946ef;
        }
        .edit-area {
            display: none;
            margin-top: 12px;
            animation: fadeIn 0.3s ease-out;
        }
        .edit-area textarea {
            width: 100%;
            height: 90px;
            background: #0d1117;
            border: 1px solid #d946ef;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 10px;
            outline: none;
        }
        .btn-save {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #d946ef;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header-tag"><i class="fa-solid fa-crown"></i> الإصدار الخاص المعتمد</div>
    <h1>موسوعة الأسماء <span>بلمسة رندة زربا</span> ✨</h1>

    <div class="search-box">
        <input type="text" id="nameInput" placeholder="اكتب الاسم هنا (مثال: نوال، جومانه)...">
        <button class="btn-search" onclick="searchName()"><i class="fa-solid fa-wand-magic-sparkles"></i> كشف</button>
    </div>

    <div class="loader" id="loader"><i class="fa-solid fa-spinner fa-spin"></i> جاري استحضار التحليل واللمسة المخصصة...</div>

    <div class="card" id="card">
        <div class="title" id="nameTitle">-</div>
        <div class="badge" id="nameOrigin">-</div>
        <div class="desc" id="nameMeaning">-</div>

        <div class="randa-box">
            <div class="randa-title"><i class="fa-solid fa-gem"></i> رأي وتحليل رندة زربا:</div>
            <div class="randa-desc" id="funnyText">-</div>
        </div>

        <button class="randa-btn" onclick="openRandaEditor()"><i class="fa-solid fa-user-gear"></i> لوحة التحكم الخاصة بـ رندة زربا</button>
        
        <div class="edit-area" id="editArea">
            <textarea id="randaInput" placeholder="اكتبي التحليل الفكاهي أو Bصمتك المخصصة لهذا الاسم..."></textarea>
            <button class="btn-save" onclick="saveRandaComment()"><i class="fa-solid fa-cloud-arrow-up"></i> اعتماد ونشر أونلاين</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD9NWqGXT1Iewyc8947i6_OJ_MXnPp0EH4",
            authDomain: "randa-names.firebaseapp.com",
            projectId: "randa-names",
            storageBucket: "randa-names.firebasestorage.app",
            messagingSenderId: "282324926770",
            appId: "1:282324926770:web:666ef9be9b07692610972b",
            databaseURL: "https://randa-names-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let db = {};
        let currentSearchName = "";

        fetch('names_db.json')
            .then(res => res.json())
            .then(data => { db = data; })
            .catch(err => console.error(err));

        function normalizeText(str) {
            return str.replace(/[أإآ]/g, 'ا').replace(/ة$/g, 'ه').replace(/[\u064B-\u0652]/g, '').trim();
        }

        function decodeHTML(html) {
            let txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        async function searchName() {
            const rawInput = document.getElementById('nameInput').value.trim();
            const card = document.getElementById('card');
            const loader = document.getElementById('loader');

            if (!rawInput) return;
            currentSearchName = rawInput;

            card.style.display = 'none';
            document.getElementById('editArea').style.display = 'none';
            loader.style.display = 'block';

            const cleanedInput = normalizeText(rawInput);
            let foundKey = Object.keys(db).find(key => normalizeText(key) === cleanedInput);

            if (foundKey) {
                document.getElementById('nameTitle').innerText = rawInput;
                document.getElementById('nameOrigin').innerText = db[foundKey].origin;
                document.getElementById('nameMeaning').innerText = db[foundKey].meaning;
            } else {
                try {
                    const searchUrl = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(rawInput + " اسم")}&format=json&origin=*`;
                    const response = await fetch(searchUrl);
                    const data = await response.json();

                    if (data.query && data.query.search.length > 0) {
                        let snippet = data.query.search[0].snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        document.getElementById('nameTitle').innerText = rawInput;
                        document.getElementById('nameOrigin').innerText = "المصدر: موسوعة ويكيبيديا المعتمدة";
                        document.getElementById('nameMeaning').innerText = decodeHTML(snippet) + "...";
                    } else {
                        document.getElementById('nameTitle').innerText = rawInput;
                        document.getElementById('nameOrigin').innerText = "أصل عربي / معتمد";
                        document.getElementById('nameMeaning').innerText = "اسم علم يحمل معاني الأصالة والرفعة والصفات الحميدة.";
                    }
                } catch (e) {
                    document.getElementById('nameTitle').innerText = rawInput;
                    document.getElementById('nameOrigin').innerText = "أصل عربي / معتمد";
                    document.getElementById('nameMeaning').innerText = "اسم علم جميل يدل على النقاء والتميز.";
                }
            }

            const cleanKeyForFirebase = cleanedInput.replace(/[.#$\[\]]/g, '');
            database.ref('randa_comments/' + cleanKeyForFirebase).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    document.getElementById('funnyText').innerText = snapshot.val();
                } else {
                    const isFemale = rawInput.endsWith('ة') || rawInput.endsWith('ه') || rawInput.endsWith('اء');
                    if (isFemale) {
                        document.getElementById('funnyText').innerText = `${rawInput} شخصية راقية وحساسة، بتعرف شو بدها بالضبط والتفاصيل عندها مية بالمية!`;
                    } else {
                        document.getElementById('funnyText').innerText = `${rawInput} شخصية قيادية، بحب الهدوء وبيفكر صح قبل أي قرار!`;
                    }
                }
                loader.style.display = 'none';
                card.style.display = 'block';
            });
        }

        function openRandaEditor() {
            const pin = prompt("أدخلي الرمز السري الخاص بـ رندة زربا:");
            if (pin === "2012") {
                document.getElementById('editArea').style.display = 'block';
                document.getElementById('randaInput').value = document.getElementById('funnyText').innerText;
            } else if (pin !== null) {
                alert("الرمز السري غير صحيح!");
            }
        }

        function saveRandaComment() {
            const comment = document.getElementById('randaInput').value.trim();
            if (!comment) return;

            const cleanKeyForFirebase = normalizeText(currentSearchName).replace(/[.#$\[\]]/g, '');
            database.ref('randa_comments/' + cleanKeyForFirebase).set(comment).then(() => {
                alert("تم اعتماد لمسة رندة زربا بنجاح وستظهر للجميع الآن!");
                document.getElementById('funnyText').innerText = comment;
                document.getElementById('editArea').style.display = 'none';
            }).catch(err => {
                alert("خطأ بالحفظ: تأكد من تفعيل Realtime Database");
            });
        }
    </script>
</body>
</html>
